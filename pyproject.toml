[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eurosat_lora"
version = "0.1.0"
description = "EuroSAT land cover classification with DINOv2 and LoRA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "scikit-learn",
    "scipy",
    "pandas",
    "matplotlib",
    "pyproj",
    "rasterio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
